# The live site: run the tracker every ten minutes, as the relay (relay.yml)
# dispatches it, and publish the run to GitHub Pages. Open pages follow it on
# their own (elnino/live.py). Each action is pinned to the commit of a
# release: a tag can be moved, and this run's token may push.
name: Live site

on:
  schedule:
    # Every five minutes from two past the hour, GitHub's shortest, off the
    # marks most schedules use: two slots in each ten minutes, and only the
    # first to come publishes, so six publishes an hour, under GitHub Pages'
    # soft limit of ten builds an hour for a site built from a branch, with
    # room for pushes. GitHub holds scheduled runs under load, most at the
    # start of each hour, and drops some: the first of all, about four slots
    # in five from 6 to 15 October 2026, and all but 20 of about 830 from 16
    # to 19 October. So the relay (relay.yml) dispatches a run at one past
    # each ten minutes, booked by itself and by each run (the book job below),
    # and each slot is a second chance: it stands down when its ten minutes'
    # run has come, held into the next ten it is that ten's run, and as every
    # run books, it takes the relay up again should both bookings be lost.
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      relay:
        description: Dispatched by the relay or its backup, standing down as a scheduled run does
        type: boolean
        default: false
  push:
    branches: [main]

# One at a time: two runs never publish over each other or race on the state.
concurrency:
  group: live-site
  cancel-in-progress: false

permissions:
  contents: write  # to push gh-pages
  actions: write   # to keep the schedule from pausing, and let go of old state

jobs:
  # Whether this run is due: one run in each ten minutes, the time cut into
  # tens from :00 UTC. A scheduled or relayed run stands down when the site
  # was published in its ten minutes, by a push, a dispatch or a run held into
  # them. Held past its ten, as GitHub held runs to 08:01 and 14:03 on 14
  # October 2026, it is the next ten's run. A push or a dispatch by hand runs,
  # unless a later run takes its place while it waits: GitHub keeps only the
  # latest waiting. Any doubt runs it, as a publish dated ahead of the clock
  # does: publish.py stamps the commit with the clock of the machine it runs
  # on. The ten minutes it was decided in, by the same reading of the clock,
  # are the booking's (the book job).
  due:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read  # to read when the site was published
    outputs:
      skip: ${{ steps.age.outputs.skip }}
      span: ${{ steps.age.outputs.span }}
    steps:
      - name: Stand down if these ten minutes' run has come
        id: age
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELAY: ${{ inputs.relay }}
        run: |
          skip=false
          now=$(date -u +%s)
          if { [ "$EVENT" = schedule ] || [ "$RELAY" = true ]; } &&
             age=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" \
                     --jq '(now - (.commit.committer.date | fromdateiso8601)) | floor'); then
            into=$(( now % 600 ))
            echo "The site was published $age seconds ago, and these ten minutes began $into seconds ago."
            if [ "$age" -ge 0 ] 2>/dev/null && [ "$age" -le "$into" ]; then skip=true; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "span=$(( now - now % 600 ))" >> "$GITHUB_OUTPUT"

  run:
    needs: due
    if: ${{ !cancelled() && needs.due.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # The last run's database and cached downloads: the alerts this run is
      # reconciled against, and the copy a failed feed falls back on. The
      # dated archive stays out; nothing reads it back.
      - name: Restore the tracker's state
        id: state
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/elnino.db
            data/raw/*.cache
            data/raw/*.meta.json
          key: tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tracker-state-

      # A job that runs out its half hour is cancelled, and a cancelled run
      # tells no one; a step that runs out its own time fails, and the
      # failure opens an issue. About 70 storm fetches one after another,
      # each allowed 120 s, can outlast the job.
      - name: Run the tracker and publish the run
        id: publish
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh auth setup-git
          # The run prints its brief, and a feed's text with it: no line of
          # it is a workflow command, fenced by a token a feed cannot know,
          # until the step's own annotations below.
          fence=$(python3 -c 'import secrets; print(secrets.token_hex(16))')
          echo "::stop-commands::$fence"
          code=0
          ./publish.sh --remote "https://github.com/$GITHUB_REPOSITORY.git" || code=$?
          echo "::$fence::"
          case $code in
            0 | 3) ;;
            1) echo "::notice title=Alerts open::Published with WARNING or CRITICAL alerts open." ;;
            *) exit "$code" ;;
          esac
          # Each of the run's problems an annotation of its own, however it
          # exited: 1, alerts open, outranks 3, degraded. A message's %, CR
          # and LF are escaped, so a feed's text cannot start a command.
          python3 - output/latest.json <<'PY'
          import json
          import sys

          SHOWN = 10  # GitHub shows ten of a step's warnings


          def escaped(text):
              return text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          try:
              with open(sys.argv[1], encoding="utf-8") as file:
                  warnings = [str(warning) for warning in json.load(file).get("warnings") or []]
          except (OSError, ValueError, AttributeError):
              warnings = []
          if len(warnings) > SHOWN:
              rest = len(warnings) - SHOWN + 1
              warnings = warnings[:SHOWN - 1] + [
                  f"{rest} more problems this run: the brief above lists them all, as latest.json does"]
          for warning in warnings:
              print(f"::warning title=Degraded run::{escaped(warning)}")
          PY

      # Only a run that published saves its state: the next run restores the
      # newest saved, and a run that failed, perhaps for its state, leaves
      # the next to start from the last good run's.
      - name: Save the tracker's state
        id: saved
        if: ${{ !cancelled() && steps.publish.outcome == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            data/elnino.db
            data/raw/*.cache
            data/raw/*.meta.json
          key: tracker-state-${{ github.run_id }}-${{ github.run_attempt }}

      # Each publishing run saves 21 MB, 3 GB a day at a run every ten minutes
      # against the repository's 10 GB, and only the latest is ever restored:
      # the one this run started from goes once this run's own is saved. A
      # save that cannot reserve its key warns and goes on, so this run's is
      # looked for by its key first. Only after a good run on main: a run that
      # failed keeps the state it started from; and a run on another branch
      # starts from main's but saves its own where main cannot restore it,
      # while a key is deleted on every branch.
      - name: Let go of the state this run started from
        if: ${{ !cancelled() && steps.publish.outcome == 'success' && steps.saved.outcome == 'success' && steps.state.outputs.cache-matched-key != '' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ steps.state.outputs.cache-matched-key }}
          NEW: tracker-state-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          listed=$(gh cache list -R "$GITHUB_REPOSITORY" --key "$NEW" --json key --jq '.[].key') || listed=
          if [ "$OLD" != "$NEW" ] && printf '%s\n' "$listed" | grep -Fxq -- "$NEW"; then
            gh cache delete "$OLD" -R "$GITHUB_REPOSITORY"
          fi

      # GitHub pauses the schedules of a public repository after 60 days
      # without activity, and the workflow with them, which the relay could
      # not dispatch then; a workflow enabled from its own run keeps going.
      # One disabled by hand while this run ran stays paused.
      - name: Keep the schedule from pausing
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.relay) }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml" --jq .state) || state=
          if [ "$state" != disabled_manually ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/live.yml/enable"
          fi

  # Book the next ten minutes' run with the relay (relay.yml), as the relay
  # books itself: one past the ten minutes after those this run was decided
  # in, as soon as it has decided, however long it then takes. Every run on
  # main books, one that stood down too, so a site published from elsewhere
  # keeps the relay going; every run in the same ten minutes books the same
  # time, and the relay holds one booking for each time, the rest spares.
  book:
    needs: due
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: write  # to dispatch the relay
    steps:
      - name: Book the next ten minutes' run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SPAN: ${{ needs.due.outputs.span }}
        run: |
          from=$SPAN
          [[ $from =~ ^[0-9]+$ ]] || from=$(date -u +%s)
          at=$(date -u -d "@$(( from - from % 600 + 660 ))" +%Y-%m-%dT%H:%M:%SZ)
          echo "Booking the next run, due at $at."
          # Asked again after 15, 30, 60 and 120 s: about four minutes of
          # GitHub turning it down.
          again() {
            local wait
            for wait in 15 30 60 120 ""; do
              "$@" && return 0
              [ -z "$wait" ] || sleep "$wait"
            done
            return 1
          }
          if ! again gh workflow run relay.yml -R "$GITHUB_REPOSITORY" --ref main -f at="$at"; then
            echo "::error title=Not booked::The run due at $at could not be booked."
            exit 1
          fi

  # GitHub deploys each push to gh-pages in a workflow of its own, pages
  # build and deployment, and one that fails tells no one: one failed with
  # "Failed to get ID Token ... Request timeout" and the site stood still for
  # 20 minutes. Each run on main reads the run.json the site serves, which a
  # run writes last, at an address of its own past the CDN's ten minutes, and
  # opens an issue when gh-pages has held a run the site does not serve for
  # more than LAG seconds, unless one is open. One deployment lost is made good
  # by the next.
  watch:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read  # to read when gh-pages was published
      issues: write   # to open the issue
    steps:
      - name: Open an issue when the site has fallen behind gh-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          LAG: 1500
        run: |
          site="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}"
          # gh-pages is one commit, "Publish the run of <run_at>" (publish.py).
          if ! branch=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" \
                          --jq '.commit.committer.date + " " + .commit.message'); then
            echo "GitHub could not say what gh-pages holds."
            exit 0
          fi
          if ! served=$(curl -fsS --max-time 20 "$site/run.json?t=$(date -u +%s)"); then
            echo "The site's run.json could not be read."
            exit 0
          fi
          # How long gh-pages has held a run the site does not serve: none while
          # the site serves gh-pages' own, however long ago it was published,
          # and the time since the push while Pages deploys it. The two runs'
          # own clocks are never set against each other. A commit publish.py
          # did not make is not judged.
          verdict=$(python3 - "$branch" "$served" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone


          def when(stamp):
              return datetime.fromisoformat(stamp.replace("Z", "+00:00"))


          try:
              committed, message = sys.argv[1].split(" ", 1)
              held = message.strip().removeprefix("Publish the run of ")
              shown = json.loads(sys.argv[2])["run_at"]
              waited = 0 if when(held) == when(shown) else int(
                  (datetime.now(timezone.utc) - when(committed)).total_seconds())
              print(waited, held, shown, committed, sep="\t")
          except (ValueError, KeyError, TypeError, AttributeError):
              pass
          PY
          )
          IFS=$'\t' read -r waited held shown committed <<< "$verdict"
          echo "gh-pages holds $branch, and the site serves $served."
          if ! [[ $waited =~ ^-?[0-9]+$ ]] || [ "$waited" -le "$LAG" ]; then exit 0; fi
          title="The site has fallen behind gh-pages"
          open=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                   --jq "map(select(.title == \"$title\")) | length") || open=
          if [[ $open =~ ^[1-9][0-9]*$ ]]; then
            echo "An issue is open on it already."
            exit 0
          fi
          body="gh-pages has held the run of $held for $(( waited / 60 )) minutes, since it was published at \
          $committed, and the site serves the run of $shown: GitHub Pages has not deployed it. The \
          deployment is a workflow of GitHub's own, pages build \
          and deployment in the Actions tab, and one that fails tells no one. The next push to gh-pages \
          deploys again, or re-run the one that failed. While this issue is open no other is opened on \
          it: close it to be told again."
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f body="$body" --jq .html_url

  # GitHub notifies whoever started a run that fails, and no one of a run its
  # own bot started, as it starts the relay (relay.yml) and the runs the relay
  # dispatches: a failed run on main opens an issue, which notifies the
  # repository's owner, unless one is open already. The same step as the
  # relay's.
  tell:
    needs: [due, run, book, watch]
    if: ${{ failure() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write  # to open the issue
    steps:
      - name: Open an issue on the failure unless one is open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          WHAT: ${{ github.workflow }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="A run of the live site failed"
          open=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" \
                   --jq "map(select(.title == \"$title\")) | length") || open=
          if [[ $open =~ ^[1-9][0-9]*$ ]]; then
            echo "An issue is open on an earlier failure; the Actions tab lists this one."
            exit 0
          fi
          body="$WHAT failed: $RUN

          GitHub tells no one of a failed run its own bot started, as it starts the \
          relay and the runs the relay dispatches, so this issue does. While it is \
          open, later failures open none, and the Actions tab lists them: close it \
          to be told of the next."
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues" -f title="$title" -f body="$body" --jq .html_url
